name: enrich-and-model-fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh security universe
        run: python universe.py
        env: &md
          DB: md:event_risk
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      - name: Enrich Polymarket metadata
        run: python enrich.py
        env: *md
      - name: Backfill probability history
        run: python backfill.py
        env: *md
      - name: Refresh prices, relevance and coefficients
        run: python pipeline_runner.py models
        env: *md
