name: institutional-ci

on:
  push:
    branches: [institutional-data-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile institutional modules
        run: |
          python -m py_compile \
            institutional_ingest.py institutional_ingest_v2.py institutional_archive.py institutional_archive_v2.py \
            institutional_mapping.py institutional_mapping_v2.py institutional_ontology.py institutional_graph.py institutional_qa.py \
            institutional_api.py institutional_ops_api.py institutional_history_api.py institutional_admin_api.py institutional_auth.py \
            institutional_stream.py institutional_exports.py institutional_service.py institutional_worker.py institutional_backfill.py \
            institutional_migrations.py migrate_institutional.py eventrisk_sdk.py
      - name: Run institutional tests
        run: python -m pytest -q tests
